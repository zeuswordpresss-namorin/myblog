name: 자동 블로그 파이프라인 통합

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: "실행 작업 선택"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - refresh
      title:
        description: "블로그 제목 (비워두면 에버그린 주제뱅크 큐에서 자동 발췌)"
        required: false
        default: ""
  schedule:
    # [FIX] 하루 자동 발행 상한(DAILY_PUBLISH_LIMIT=2)과 실행 횟수를 일치시킴.
    # cron은 UTC 기준이므로 0시/12시(UTC) = 한국시간(KST) 오전 9시/오후 9시에 실행됩니다.
    # (수동 실행(workflow_dispatch, 제목 직접 입력)은 이 스케줄과 무관하게 언제든 별도로 발행 가능하며, 하루 상한의 영향을 받지 않습니다.)
    - cron: "0 0,12 * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 확보 (나눔고딕 — apt 우선, 실패 시 curl 백업)
        run: |
          # [FIX] curl 다운로드가 네트워크 상황에 따라 조용히 실패해 썸네일 한글이 깨지는 문제가
          # 있었습니다. Ubuntu 저장소의 fonts-nanum 패키지를 1순위로 사용해 안정성을 높입니다.
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum fonts-noto-cjk || echo "apt 폰트 설치 실패, curl로 백업 시도"
          if [ ! -f /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf ]; then
            curl -fsSL -o font.ttf \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf" \
              --max-time 30 || echo "curl 백업 다운로드도 실패, 스크립트 내부 기본 폰트로 대체됩니다."
          fi
          # 최종 확보 여부 확인 (실패해도 빌드는 계속 진행 — 스크립트 자체에도 폴백 로직 있음)
          if [ -f /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf ] || { [ -f font.ttf ] && [ -s font.ttf ]; }; then
            echo "한글 폰트 확보 완료"
          else
            echo "::warning::한글 폰트 확보 실패 - 썸네일 한글이 깨져 보일 수 있습니다"
          fi

      - name: 필요 패키지 설치
        run: pip install requests pillow

      - name: 블로그 발행 실행 (써치 및 트래픽 필터 자동 연동)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ENABLE_AUTO_TRANSLATE: ${{ vars.ENABLE_AUTO_TRANSLATE }}
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}
          COUPANG_PARTNER_TAG: ${{ secrets.COUPANG_PARTNER_TAG }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # --- [NEW] 워드프레스 동시 자동 발행 ---
          # WORDPRESS_CLIENT_ID/SECRET이 있으면 워드프레스닷컴(*.wordpress.com) OAuth2 방식,
          # 없으면 자체호스팅 워드프레스용 Basic Auth 방식으로 자동 분기합니다.
          # WORDPRESS_URL: Variables 또는 Secrets 어느 쪽에 등록해도 인식되도록 폴백 처리
          # (Secrets/Variables 탭 혼동으로 인한 "미설정" 오인식 방지)
          WORDPRESS_URL: ${{ vars.WORDPRESS_URL || secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_CLIENT_ID: ${{ secrets.WORDPRESS_CLIENT_ID }}
          WORDPRESS_CLIENT_SECRET: ${{ secrets.WORDPRESS_CLIENT_SECRET }}
          # --- [NEW] 썸네일용 무료 스톡 이미지(Pexels, 출처 표기) ---
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.action_type }}" == "refresh" ]; then
            python generate_post.py refresh
          else
            python generate_post.py "${{ github.event.inputs.title }}"
          fi

      - name: 변경사항 커밋 및 push
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add docs keywords_queue.json
          git diff --cached --quiet && echo "변경사항 없음, 커밋 생략" || git commit -m "자동 파이프라인 실행: $(date +'%Y-%m-%d %H:%M')"
          git push
